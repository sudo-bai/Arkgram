import java.nio.file.Paths
import org.gradle.internal.os.OperatingSystem

plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
    id 'org.telegram.build-plugin'
    id 'org.telegram.build-app-plugin'
    id 'idea'
}

idea {
    module {
        excludeDirs += [
            file('jni/td'),
            file('jni/third_party'),
            file('jni/third_party/absl'),
            file('jni/third_party/boringssl'),
            file('jni/third_party/dav1d'),
            file('jni/third_party/ffmpeg'),
            file('jni/third_party/libvpx'),
            file('jni/third_party/libyuv'),
            file('jni/third_party/openh264'),
            file('jni/third_party/xiph'),
            file('jni/third_party/wamr'),
            file('jni/third_party/libprisma'),
            file('jni/third_party/boost-regex'),
            file('jni/tgcalls'),
            file('jni/ffmpeg'),
            file('jni/tlottie'),
            file('jni/boringssl'),
            file('jni/voip/webrtc'),
            file('jni/sqlite')
        ]
    }
}

def buildTimestamp = System.getenv('BUILD_TIMESTAMP') ?: '0'
def commitId = System.getenv('COMMIT_ID')
def verName = "${APP_VERSION_NAME}${commitId?.take(7) ? "-${commitId.take(7)}" : ''}"
def verCode = 1261

def officialVer = APP_VERSION_NAME
def officialCode = APP_VERSION_CODE

def keystorePwd = null
def alias = null
def pwd = null

Properties properties
def base64 = System.getenv('LOCAL_PROPERTIES')
if (base64 != null && !base64.isBlank()) {
    properties = new Properties()
    properties.load(new ByteArrayInputStream(Base64.decoder.decode(base64)))
} else if (project.rootProject.file('local.properties').exists()) {
    properties = new Properties()
    properties.load(project.rootProject.file('local.properties').newDataInputStream())
}

if (properties != null) {
    keystorePwd = properties.getProperty('KEYSTORE_PASS')
    alias = properties.getProperty('ALIAS_NAME')
    pwd = properties.getProperty('ALIAS_PASS')
}

keystorePwd = keystorePwd ?: System.getenv('KEYSTORE_PASS')
alias = alias ?: System.getenv('ALIAS_NAME')
pwd = pwd ?: System.getenv('ALIAS_PASS')

def nativeTarget = System.getenv('NATIVE_TARGET') ?: ''

if (nativeTarget == 'SKIP') {
    // Disable the heavy native + JVM test tasks. Match precisely: a naive
    // name.contains('test') also hits "crea-test-aging"/"genera-test-aging" tasks
    // (createStagingCompatibleScreenManifests, generateStagingRFile) and breaks the
    // staging variant.
    tasks.configureEach { task ->
        final String n = task.name.toLowerCase()
        final boolean isNative = n.contains('cmake') || n.contains('jni') ||
            n.startsWith('externalnativebuild') || n.startsWith('strip') && n.contains('debugsymbols')
        final boolean isTest = n.startsWith('test') || n.startsWith('connected') ||
            n.endsWith('unittest') || n.endsWith('androidtest')
        if (isNative || isTest) {
            task.enabled = false
        }
    }
}

android {
    defaultConfig.applicationId = APP_PACKAGE

    androidResources {
        // EmojiPack.java opens assets/emoji.pack with AssetManager.openFd() and mmaps it,
        // which requires the asset to be stored uncompressed. Upstream declares
        // `noCompress += "pack"` in the separate TMessagesProj_App* application modules;
        // this fork removed those modules and builds TMessagesProj as the application, so
        // the rule has to live here or emoji.pack gets deflated and startup crashes with
        // FileNotFoundException: ... probably compressed.
        noCompress += "pack"
        localeFilters += [
                'en', 'ar', 'de', 'es', 'es-rES', 'fa-rIR', 'in-rID', 'it', 'it-rIT', 'ja-rJP',
                'ko', 'nl', 'pl-rPL', 'pt-rBR', 'ru-rRU', 'tr-rTR', 'uk-rUA', 'vi-rVN', 'zh-rCN', 'zh-rTW'
        ]
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    splits {
        abi {
            enable = true
            reset()
            universalApk = false
            if (nativeTarget == 'universal') {
                universalApk = true
                include 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
            } else if (!nativeTarget.isBlank()) {
                include nativeTarget
            } else {
                include 'arm64-v8a', 'x86_64'
            }
        }
    }

    defaultConfig {
        versionName verName
        versionCode verCode

        // obtain your own keys at https://core.telegram.org/api/obtaining_api_id
        def appId = '6'
        def appHash = 'eb06d4abfb49dc3eeb1aeb98ae0f581e'

        if (properties != null) {
            appId = properties.getProperty('TELEGRAM_APP_ID') ?: System.getenv('TELEGRAM_APP_ID') ?: appId
            appHash = properties.getProperty('TELEGRAM_APP_HASH') ?: System.getenv('TELEGRAM_APP_HASH') ?: appHash
        }

        vectorDrawables.generatedDensities = ['mdpi', 'hdpi', 'xhdpi', 'xxhdpi']

        multiDexEnabled true

        buildConfigField 'String', 'BUILD_VERSION_STRING', '"' + verName + '"'
        buildConfigField 'String', 'OFFICIAL_VERSION', '"' + officialVer + '"'
        buildConfigField 'int', 'OFFICIAL_VERSION_CODE', officialCode + ''
        buildConfigField 'int', 'APP_ID', appId
        buildConfigField 'String', 'APP_HASH', '"' + appHash + '"'
        buildConfigField 'long', 'BUILD_TIMESTAMP', buildTimestamp + 'L'

        externalNativeBuild {
            cmake {
                version '3.22.1'
                arguments '-DANDROID_STL=c++_static', '-DANDROID_PLATFORM=android-27', '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'
                targets 'tmessages.49'
                System.getenv('PATH').split(File.pathSeparator).any { path ->
                    var file = Paths.get("${path}${File.separator}ccache${if (OperatingSystem.current().windows) ".exe" else ""}").toFile()
                    if (file.exists()) {
                        println("Using ccache ${file.getAbsolutePath()}")
                        arguments += "-DANDROID_CCACHE=${file.getAbsolutePath()}"
                        return true
                    }
                }
            }
        }

        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ['room.schemaLocation': "$projectDir/schemas".toString()]
            }
        }
    }

    bundle {
        language {
            enableSplit = false
        }
    }

    externalNativeBuild {
        cmake {
            path = 'jni/CMakeLists.txt'
        }
    }

    signingConfigs {
        release {
            storeFile project.file('release.keystore')
            storePassword keystorePwd
            keyAlias alias
            keyPassword pwd
        }
    }

    buildTypes {
        debug {
            isDefault = true
            debuggable = true
            jniDebuggable = true
            multiDexEnabled = true
            signingConfig = signingConfigs.release
            buildConfigField "boolean", "DEBUG_VERSION", "true"
            buildConfigField "boolean", "DEBUG_PRIVATE_VERSION", "true"
        }

        staging {
            debuggable = false
            jniDebuggable = false
            minifyEnabled = true
            shrinkResources = true
            multiDexEnabled = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            matchingFallbacks = ['release', 'staging', 'debug']
            signingConfig = signingConfigs.release
            buildConfigField "boolean", "DEBUG_VERSION", "true"
            buildConfigField "boolean", "DEBUG_PRIVATE_VERSION", "true"
        }

        release {
            debuggable = false
            jniDebuggable = false
            minifyEnabled = true
            shrinkResources = true
            multiDexEnabled = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            matchingFallbacks = ['release', 'staging', 'debug']
            signingConfig = signingConfigs.release
            buildConfigField "boolean", "DEBUG_VERSION", "false"
            buildConfigField "boolean", "DEBUG_PRIVATE_VERSION", "false"
        }
    }

    sourceSets.main.jniLibs.srcDirs = ['./jni/']

    namespace = 'org.telegram.messenger'
}

// android.hardware.fingerprint.FingerprintManager was removed in API 37 (see
// <sdk>/platforms/android-37.0/data/api-versions.xml: removed="37.0"), yet this fork compiles
// with compileSdk 37 because androidx.core 1.19.0 declares minCompileSdk=37. Upstream builds
// with compileSdk 36 and therefore never hits this. Wallet's API 23-29 unlock path still uses
// the class directly, so './stubs' is put on javac's -sourcepath with -implicit:none: symbols
// resolve for compilation, but no .class is generated and nothing reaches the APK.
tasks.withType(JavaCompile).configureEach {
    if (project.name == 'TMessagesProj') {
        options.sourcepath = files('stubs')
        options.compilerArgs += ['-implicit:none']
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.forEach { output ->
            String gramName = 'Arkgram'
            String first = String.format('%s-v%s(%s)', gramName, verName, verCode)
            output.outputFileName.set(
                output.outputFileName.get()
                    .replace('TMessagesProj', first)
                    .replace('-release', '')
                    .replace('-staging', '')
            )
        }
    }
}

configurations.configureEach {
    exclude group: 'androidx.recyclerview', module: 'recyclerview'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    // org.unifiedpush.android:connector pulls com.google.crypto.tink:tink (JVM variant),
    // while androidx.security:security-crypto (via recaptcha) pulls tink-android.
    // Both ship the same classes; keep the Android variant only.
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'com.google.crypto.tink' && details.requested.name == 'tink') {
            details.useTarget 'com.google.crypto.tink:tink-android:1.23.0'
        }
    }
}

