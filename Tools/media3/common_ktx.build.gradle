// Checked-in copy of TMessagesProj_Modules/media/libraries/common_ktx/build.gradle,
// used through `buildFileName` in settings.gradle.
//
// AGP 9 turns on built-in Kotlin and registers a `kotlin` extension on every Android
// project. The bundled media3 module then fails with
//   "Cannot add extension with name 'kotlin', as there is an extension already
//    registered with that name"
// when it applies the standalone `kotlin-android` plugin on top. The media3 submodule is
// a read-only upstream checkout, so Arkgram keeps its own copy of this one build script
// with the duplicate plugin application removed; sources, dependencies and publishing
// config stay identical. Re-diff against the submodule when bumping
// TMessagesProj_Modules/media.
